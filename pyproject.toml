[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontend-agent-benchmark"
version = "0.1.0"
description = "面向代码代理工具的前端能力测试集"
requires-python = ">=3.10"
dependencies = ["deepeval==4.2.0"]

[project.scripts]
agent-bench = "benchmark.cli:main"
model-dashboard = "model_dashboard.server:main"
score-pelican = "benchmark.pelican_scoring:main"

[tool.setuptools.packages.find]
include = ["benchmark*", "model_dashboard*"]

[tool.setuptools.package-data]
model_dashboard = ["seed_data.json", "static/*.html"]
