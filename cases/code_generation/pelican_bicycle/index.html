<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" aria-label="鹈鹕骑自行车处理障碍动画"></svg>
<p class="caption">
  <b>鹈鹕骑自行车处理障碍</b>：统一时间线调度石头与坠落物 —— 接近石头减速并跃过；坠落物按 alt(τ)=alt₀−v₀τ−½gτ² 下落，鹈鹕提前刹车停让；组合事件时两者同时处理，双脚始终踩在踏板上、近侧翅膀始终扶住车把。
</p>
<script>
"use strict";
// ===== 纯仿真核心：无 DOM 依赖，固定步长确定性推进 =====
// 世界坐标：x 向右增长，高度 alt 以地面为 0、向上为正。
// 车身局部坐标：原点在前后轮触地点之间的地面处，y 向下为负值向上（SVG 习惯）。
// ----- 常量 -----
const DT = 1 / 120; // 固定仿真步长
const VIEW_W = 960;
const VIEW_H = 640;
const GROUND_Y = 540; // 地面屏幕 y
const BIKE_SCREEN_X = 300; // 骑手固定屏幕 x
const WHEEL_R = 42;
const FRONT_OFFSET = 78; // 前轮中心相对车身原点
const REAR_OFFSET = -60;
const CRANK_ARM = 15;
const CRANK_K = 1 / 16; // 曲柄角速度系数 rad/px
const CRUISE_SPEED = 180;
const ACCEL = 140;
const APPROACH_DECEL = 160;
const APPROACH_MIN = 95;
const BRAKE_DECEL = 300;
const STONE_LOOKAHEAD = 300;
const STONE_STOP_GAP = 130; // 因掉落物停车时与前石的最小间距
const HOP_TRIGGER_GAP = 90; // 前轮距石多近起跳
const HOP_H = 52;
const HOP_LEN = 280; // 起跳到落地的水平行程
const HOP_RAMP = 70; // 上升/下降段长度
const HOP_TARGET = 140;
const HOP_ACCEL = 160;
const SAFE_GAP = 110; // 停车后前轮到落点的安全距离
const LAND_HOLD = 0.7; // 落地后停留时间
const DROP_GONE_DELAY = 0.7;
const CYCLE_T = 24; // 场景循环周期
// 车身局部几何（y 向下为正，向上为负）
const GEO = {
    rearWheel: { x: REAR_OFFSET, y: -WHEEL_R },
    frontWheel: { x: FRONT_OFFSET, y: -WHEEL_R },
    crank: { x: 4, y: -46 },
    hip: { x: -30, y: -126 }, // 近侧腿髋关节
    hipFar: { x: -25, y: -128 }, // 远侧腿髋关节（视觉错位）
    thigh: 52,
    shin: 56,
    shoulder: { x: -2, y: -172 },
    upperArm: 48,
    foreArm: 46,
    grip: { x: 72, y: -134 }, // 车把握持点
    neckBase: { x: 10, y: -168 },
    head: { x: 34, y: -208 },
    beakTip: { x: 112, y: -198 },
    seat: { x: -36, y: -126 },
    headTubeTop: { x: 64, y: -116 },
};
function clamp(v, lo, hi) {
    return v < lo ? lo : v > hi ? hi : v;
}
function smoothstep(u) {
    const t = clamp(u, 0, 1);
    return t * t * (3 - 2 * t);
}
// 两骨段 IK：返回关节点；bend=-1 时关节偏向目标方向线的上方/前侧。
function ik2(hip, target, l1, l2, bend) {
    const dx = target.x - hip.x;
    const dy = target.y - hip.y;
    let d = Math.hypot(dx, dy);
    let clamped = false;
    const maxD = l1 + l2 - 0.5;
    const minD = Math.abs(l1 - l2) + 0.5;
    let tx = target.x;
    let ty = target.y;
    if (d > maxD || d < minD) {
        clamped = true;
        const nd = clamp(d, minD, maxD);
        const s = d === 0 ? 0 : nd / d;
        tx = hip.x + dx * s;
        ty = hip.y + dy * s;
        d = nd;
    }
    const a = Math.atan2(ty - hip.y, tx - hip.x);
    const cosA = clamp((d * d + l1 * l1 - l2 * l2) / (2 * d * l1), -1, 1);
    const ang = Math.acos(cosA);
    const ja = a + bend * ang;
    return {
        joint: { x: hip.x + l1 * Math.cos(ja), y: hip.y + l1 * Math.sin(ja) },
        target: { x: tx, y: ty },
        clamped,
    };
}
function rotatePt(p, pivot, rad) {
    const c = Math.cos(rad);
    const s = Math.sin(rad);
    const dx = p.x - pivot.x;
    const dy = p.y - pivot.y;
    return { x: pivot.x + dx * c - dy * s, y: pivot.y + dx * s + dy * c };
}
class EventScheduler {
    constructor() {
        this.events = [];
    }
    addStone(id, at, x, w, h) {
        this.events.push({
            id,
            at,
            cycle: 0,
            lead: x,
            spawn: () => ({ kind: "stone", id: `${id}#${this.cycleOf(id)}`, x, w, h }),
        });
    }
    addDrop(id, at, x, alt0, v0, g, r) {
        this.events.push({
            id,
            at,
            cycle: 0,
            lead: x,
            spawn: () => makeDrop(`${id}#${this.cycleOf(id)}`, x, alt0, v0, g, r, -1),
        });
    }
    cycleOf(id) {
        const ev = this.events.find((e) => e.id === id);
        return ev ? ev.cycle - 1 : 0;
    }
    update(t, bikeX, out) {
        const fired = [];
        for (const ev of this.events) {
            while (t >= ev.at + ev.cycle * CYCLE_T) {
                const k = ev.cycle;
                ev.cycle += 1;
                if (k === 0) {
                    out.push(ev.spawn());
                }
                else {
                    // 循环周期：按骑手当前位置生成在前方，保持相对布局
                    const base = ev.lead;
                    const shifted = bikeX + 900 + (base - 1150);
                    const e = ev.spawn();
                    e.x = shifted;
                    out.push(e);
                }
                fired.push(ev.id);
            }
        }
        return fired;
    }
}
function makeDrop(id, x, alt0, v0, g, r, spawnTime) {
    const disc = v0 * v0 + 2 * g * (alt0 - r);
    const tauLand = disc > 0 ? (-v0 + Math.sqrt(disc)) / g : 0;
    return {
        kind: "drop",
        id,
        x,
        alt0,
        v0,
        g,
        r,
        spawnTime,
        tau: 0,
        alt: alt0,
        landed: false,
        landTime: spawnTime >= 0 ? spawnTime + tauLand : -1,
        predictedLandTime: spawnTime >= 0 ? spawnTime + tauLand : -1,
        gone: false,
        goneTime: -1,
    };
}
class Simulation {
    constructor() {
        this.t = 0;
        this.bikeX = 0;
        this.v = CRUISE_SPEED;
        this.mode = "cruise";
        this.lift = 0;
        this.stopReason = null;
        this.entities = [];
        this.scheduler = new EventScheduler();
        this.firedLog = [];
        this.headAim = 0; // 0 平视，1 抬头看向坠落物
        this.lean = 0; // 上身后仰（刹车/停车时）
        this.hopStartX = 0;
        this.hopStoneId = "";
        this.stoneSeq = 0;
        this.dropSeq = 0;

        this.buildScenario();
        this.reset();

    buildScenario() {
        const s = this.scheduler;
        // 阶段 1：单石头（减速 + 跃过）
        s.addStone("stone-1", 0.0, 1150, 44, 26);
        // 阶段 2：单掉落物（可测轨迹 + 刹车停让）
        s.addDrop("drop-1", 8.5, 1750, 420, 20, 340, 13);
        // 阶段 3：组合事件（石头在前，坠落物落在更前方）
        s.addStone("stone-2", 12.0, 2900, 44, 26);
        s.addDrop("drop-2", 17.0, 3200, 420, 20, 340, 13);
    }
    reset() {
        this.t = 0;
        this.bikeX = 0;
        this.v = CRUISE_SPEED;
        this.mode = "cruise";
        this.lift = 0;
        this.stopReason = null;
        this.entities = [];
        this.firedLog = [];
        this.headAim = 0;
        this.lean = 0;
        this.hopStartX = 0;
        this.hopStoneId = "";
        this.stoneSeq = 0;
        this.dropSeq = 0;
        this.brakeTarget = null;
        for (const ev of this.scheduler.events)
            ev.cycle = 0;

    get frontX() {
        return this.bikeX + FRONT_OFFSET;
    }
    get wheelAngle() {
        return this.bikeX / WHEEL_R;
    }
    get crankAngle() {
        return this.bikeX * CRANK_K;
    }
    stones() {
        return this.entities.filter((e) => e.kind === "stone");
    }
    drops() {
        return this.entities.filter((e) => e.kind === "drop");
    }
    // 威胁中的掉落物：未消失、落点在前方、距离可反应
    threatDrops() {
        return this.drops().filter((d) => !d.gone && d.x - this.frontX > -10 && d.x - this.frontX < 700);
    }
    // 需要处理的石头：在前方视野内
    threatStones() {
        return this
            .stones()
            .filter((s) => s.id !== this.hopStoneId && s.x - this.frontX > -20 && s.x - this.frontX < STONE_LOOKAHEAD + 40)
            .sort((a, b) => a.x - b.x);
    }
    step(dt) {
        // 1) 统一调度器：按时间线生成实体
        const base = this.entities.length;
        const fired = this.scheduler.update(this.t, this.bikeX, this.entities);
        // fired[i] 与本步新增的第 i 个实体一一对应（同一 tick 可能触发多个事件，
        // 不能一律取 entities 末尾，否则多触发时补丁会打到同一个实体上）。
        const spawnedList = this.entities.slice(base);
        fired.forEach((id, i) => {
            const spawned = spawnedList[i];
            this.firedLog.push({ id, t: this.t });
            if (spawned && spawned.kind === "drop") {
                spawned.spawnTime = this.t;
                const d = spawned;
                const disc = d.v0 * d.v0 + 2 * d.g * (d.alt0 - d.r);
                const tauLand = disc > 0 ? (-d.v0 + Math.sqrt(disc)) / d.g : 0;
                d.landTime = this.t + tauLand;
                d.predictedLandTime = d.landTime;
            }
            if (id.startsWith("stone"))
                this.stoneSeq += 1;
            if (id.startsWith("drop"))
                this.dropSeq += 1;
        });
        // 2) 掉落物运动学：闭式轨迹 alt(τ) = alt0 - v0·τ - ½·g·τ²
        for (const d of this.drops()) {
            if (d.spawnTime < 0)
                d.spawnTime = this.t;
            d.tau = Math.max(0, this.t - d.spawnTime);
            if (!d.landed) {
                d.alt = d.alt0 - d.v0 * d.tau - 0.5 * d.g * d.tau * d.tau;
                if (d.alt <= d.r) {
                    d.alt = d.r;
                    d.landed = true;
                    if (d.landTime < 0)
                        d.landTime = this.t;
                }
            }
            if (d.landed && !d.gone && this.t >= d.landTime + DROP_GONE_DELAY) {
                d.gone = true;
                d.goneTime = this.t;
            }
        }
        // 3) 模式状态机
        this.updateMode(dt);
        // 4) 积分速度 / 位置
        this.bikeX += this.v * dt;
        // 5) 跃障高度（距离驱动的梯形弧线）
        if (this.mode === "hop") {
            const s = this.bikeX - this.hopStartX;
            if (s < HOP_RAMP)
                this.lift = HOP_H * smoothstep(s / HOP_RAMP);
            else if (s > HOP_LEN - HOP_RAMP)
                this.lift = HOP_H * smoothstep((HOP_LEN - s) / HOP_RAMP);
            else
                this.lift = HOP_H;
        }
        else {
            this.lift = 0;
        }
        // 6) 姿态平滑（抬头看坠落物 / 刹车后仰）
        const aimTarget = this.threatDrops().some((d) => !d.landed) ? 1 : 0;
        this.headAim += (aimTarget - this.headAim) * Math.min(1, dt * 6);
        const leanTarget = this.mode === "brake" || this.mode === "stopped" ? -0.1 : 0;
        this.lean += (leanTarget - this.lean) * Math.min(1, dt * 6);
        this.t += dt;
        // 7) 清理远离的实体
        if (this.entities.length > 24) {
            this.entities = this.entities.filter((e) => e.x > this.bikeX - 800 && !(e.kind === "drop" && e.gone && this.t - e.goneTime > 1));
        }
    }
    stopDist(v) {
        return (v * v) / (2 * BRAKE_DECEL);
    }
    updateMode(dt) {
        const threats = this.threatDrops();
        // 因掉落物需要的停车线（自行车原点坐标）
        let dropStopX = Infinity;
        for (const d of threats) {
            if (d.landTime >= this.t || (d.landed && this.t < d.landTime + DROP_GONE_DELAY)) {
                dropStopX = Math.min(dropStopX, d.x - SAFE_GAP - FRONT_OFFSET);
            }
        }
        const stones = this.threatStones();
        let stoneStopX = Infinity;
        for (const s of stones)
            stoneStopX = Math.min(stoneStopX, s.x - STONE_STOP_GAP - FRONT_OFFSET);
        switch (this.mode) {
            case "hop": {
                this.v = Math.min(this.v + HOP_ACCEL * dt, HOP_TARGET);
                if (this.bikeX - this.hopStartX >= HOP_LEN) {
                    this.mode = "land";
                    this.lift = 0;
                    this.hopStoneId = "";
                }
                return;
            }
            case "brake": {
                const target = this.brakeTarget;
                this.v = Math.max(0, this.v - BRAKE_DECEL * dt);
                if (this.v <= 0 || (target !== null && this.bikeX >= target)) {
                    this.v = 0;
                    if (target !== null)
                        this.bikeX = Math.min(this.bikeX, target);
                    this.mode = "stopped";
                }
                return;
            }
            case "stopped": {
                this.v = 0;
                let release = 0;
                for (const d of this.threatDrops()) {
                    if (!d.gone)
                        release = Math.max(release, d.landTime + DROP_GONE_DELAY);
                }
                if (this.t >= release) {
                    this.mode = "resume";
                    this.stopReason = null;
                }
                return;
            }
            default:
                break;
        }
        // cruise / approach / land / resume：统一决策
        // 优先级 1：坠落物停车（组合事件时停车线同时受前方石头约束）
        if (dropStopX < Infinity) {
            const stopX = Math.min(dropStopX, stoneStopX);
            if (stopX - this.bikeX <= this.stopDist(this.v) + 20 && stopX > this.bikeX - 4) {
                this.mode = "brake";
                this.stopReason = "drop";
                this.brakeTarget = stopX;
                this.v = Math.max(0, this.v - BRAKE_DECEL * dt);
                return;
            }
        }
        // 优先级 2：石头 —— 近距起跳跃过，远距减速接近
        if (stones.length > 0) {
            const s = stones[0];
            const gap = s.x - this.frontX;
            if (gap <= HOP_TRIGGER_GAP && gap > -20) {
                this.mode = "hop";
                this.hopStartX = this.bikeX;
                this.hopStoneId = s.id;
                this.lift = 0;
                return;
            }
            this.mode = "approach";
            if (this.v > APPROACH_MIN)
                this.v = Math.max(APPROACH_MIN, this.v - APPROACH_DECEL * dt);
            else
                this.v = Math.min(APPROACH_MIN, this.v + ACCEL * dt);
            return;
        }
        // 优先级 3：恢复巡航
        this.mode = this.v >= CRUISE_SPEED - 0.5 ? "cruise" : this.mode === "land" || this.mode === "resume" ? "resume" : "cruise";
        this.v = Math.min(CRUISE_SPEED, this.v + ACCEL * dt);
        if (this.v >= CRUISE_SPEED - 0.01)
            this.mode = "cruise";
    }
    // ----- 供渲染与验证使用的几何 -----
    pedalPos(phase) {
        const a = this.crankAngle + phase;
        return { x: GEO.crank.x + CRANK_ARM * Math.cos(a), y: GEO.crank.y + CRANK_ARM * Math.sin(a) };
    }
    legIK(hipLocal, pedal, bend) {
        return ik2(hipLocal, pedal, GEO.thigh, GEO.shin, bend);
    }
    // 上身后仰时肩点绕髋旋转，翅膀 IK 仍精确落在握把上
    shoulderPos() {
        return rotatePt(GEO.shoulder, GEO.hip, this.lean);
    }
    wingIK() {
        return ik2(this.shoulderPos(), GEO.grip, GEO.upperArm, GEO.foreArm, -1);
    }
    localToScreen(p) {
        return { x: BIKE_SCREEN_X + p.x, y: GROUND_Y - this.lift + p.y };
    }
    snapshot() {
        return {
            t: this.t,
            bikeX: this.bikeX,
            frontX: this.frontX,
            v: this.v,
            mode: this.mode,
            lift: this.lift,
            stopReason: this.stopReason,
            wheelAngle: this.wheelAngle,
            crankAngle: this.crankAngle,
            headAim: this.headAim,
            lean: this.lean,
            fired: this.firedLog.slice(),
            stones: this.stones().map((s) => ({ id: s.id, x: s.x, w: s.w, h: s.h, screenX: s.x - this.bikeX + BIKE_SCREEN_X, gap: s.x - this.frontX })),
            drops: this.drops().map((d) => ({
                id: d.id,
                x: d.x,
                alt: d.alt,
                tau: d.tau,
                alt0: d.alt0,
                v0: d.v0,
                g: d.g,
                r: d.r,
                spawnTime: d.spawnTime,
                landed: d.landed,
                landTime: d.landTime,
                gone: d.gone,
                screenX: d.x - this.bikeX + BIKE_SCREEN_X,
                screenY: GROUND_Y - d.alt,
                gap: d.x - this.frontX,
            })),

    }
    geometry() {
        const pedalNear = this.pedalPos(0);
        const pedalFar = this.pedalPos(Math.PI);
        const legNear = this.legIK(GEO.hip, pedalNear, -1);
        const legFar = this.legIK(GEO.hipFar, pedalFar, -1);
        const wing = this.wingIK();
        const scr = (p) => this.localToScreen(p);
        return {
            pedalNear: scr(pedalNear),
            pedalFar: scr(pedalFar),
            footNear: scr(legNear.target),
            footFar: scr(legFar.target),
            kneeNear: scr(legNear.joint),
            kneeFar: scr(legFar.joint),
            legNearClamped: legNear.clamped,
            legFarClamped: legFar.clamped,
            wingTip: scr(wing.target),
            wingElbow: scr(wing.joint),
            wingClamped: wing.clamped,
            grip: scr(GEO.grip),
            shoulder: scr(this.shoulderPos()),

            wheelBottomY: GROUND_Y - this.lift,
        };
    }
}

class Renderer {

        svgEl("path", { d: "M 8 -166 Q 16 -190 32 -204", stroke: BODY_FILL, "stroke-width": 15, fill: "none", "stroke-linecap": "round" }, u); // 颈
        svgEl("path", { d: "M 8 -166 Q 16 -190 32 -204", stroke: INK, "stroke-width": 2, fill: "none", opacity: 0.35, transform: "translate(0,7)" }, u);
        // 头组（抬头动作）

        svgEl("path", { d: `M 40 ${GEO.head.y - 8} L ${GEO.beakTip.x} ${GEO.beakTip.y - 4} L ${GEO.beakTip.x - 2} ${GEO.beakTip.y + 2} L 42 ${GEO.head.y + 2} Z`, fill: BEAK, stroke: "#c77f28", "stroke-width": 1.5 }, hd); // 长喙上颚
        svgEl("circle", { cx: GEO.head.x, cy: GEO.head.y, r: 11.5, fill: BODY_FILL, stroke: INK, "stroke-width": 2 }, hd); // 头
        svgEl("circle", { cx: 37, cy: -211, r: 2.4, fill: INK }, hd); // 眼
        svgEl("circle", { cx: 37.8, cy: -211.8, r: 0.8, fill: "#fff" }, hd);
        svgEl("path", { d: "M 28 -218 L 22 -228 M 33 -219 L 30 -230", stroke: BODY_SHADE, "stroke-width": 2.5, "stroke-linecap": "round" }, hd); // 冠羽
        // ---- 近侧：曲柄 + 踏板 + 腿 + 脚 ----
        const nearLayer = svgEl("g", { id: "layer-near" }, b);
        r.crankArmNear = svgEl("line", { stroke: "#4c4740", "stroke-width": 5.5, "stroke-linecap": "round" }, nearLayer);
        r.pedalNear = svgEl("rect", { x: -9, y: -2.5, width: 18, height: 5, rx: 2, fill: "#3f3a33" }, nearLayer);
        r.legNear = svgEl("path", { stroke: LEG, "stroke-width": 9, fill: "none", "stroke-linecap": "round" }, nearLayer);
        r.kneeNear = svgEl("circle", { r: 4.5, fill: LEG, stroke: "#b57d28", "stroke-width": 1 }, nearLayer);
        r.footNear = svgEl("path", { stroke: "#d98f2c", "stroke-width": 5.5, fill: "none", "stroke-linecap": "round" }, nearLayer);
        r.markerPedalNear = svgEl("circle", { id: "marker-pedal-near", r: 2, fill: "#2e7d32" }, nearLayer);
        r.markerFootNear = svgEl("circle", { id: "marker-foot-near", r: 2, fill: "#2e7d32" }, nearLayer);
        svgEl("circle", { cx: GEO.crank.x, cy: GEO.crank.y, r: 3.2, fill: "#3f3a33" }, nearLayer);
        // ---- 近侧翅膀：肩 → 肘 → 车把（翅尖始终接触握把） ----
        r.wingUpper = svgEl("line", { stroke: BODY_FILL, "stroke-width": 12, "stroke-linecap": "round" }, b);
        r.wingUpperInk = svgEl("line", { stroke: INK, "stroke-width": 2, opacity: 0.3, "stroke-linecap": "round" }, b);
        r.wingFore = svgEl("line", { stroke: BODY_FILL, "stroke-width": 9, "stroke-linecap": "round" }, b);
        r.wingTipDot = svgEl("circle", { r: 4.2, fill: BODY_SHADE, stroke: INK, "stroke-width": 1.5 }, b); // 翅尖（手状钩）
        r.markerWingTip = svgEl("circle", { id: "marker-wing-tip", r: 2.4, fill: "#c62828", opacity: 0.9 }, b);
    }
    buildWheel(parent, id, c) {
        const g = svgEl("g", { id, transform: `translate(${c.x},${c.y})` }, parent);
        const spin = svgEl("g", { class: "spin" }, g);
        if (id === "wheel-rear")
            this.spinRear = spin;
        else if (id === "wheel-front")
            this.spinFront = spin;
        for (let i = 0; i < 8; i++) {
            const a = (i * Math.PI) / 4;
            svgEl("line", { x1: -Math.cos(a) * 34, y1: -Math.sin(a) * 34, x2: Math.cos(a) * 34, y2: Math.sin(a) * 34, stroke: "#8d8d8d", "stroke-width": 1.6 }, spin);
        }
        svgEl("circle", { r: WHEEL_R, fill: "none", stroke: TIRE, "stroke-width": 7 }, g);
        svgEl("circle", { r: 34.5, fill: "none", stroke: "#a9a9a9", "stroke-width": 2 }, g);
        svgEl("circle", { r: 4.5, fill: "#6d6d6d" }, g);
        svgEl("circle", { r: 1.8, cx: 30, cy: 0, fill: "#e0e0e0", opacity: 0.85 }, spin); // 辐条反光点，便于观察旋转
        return g;
    }
    stoneNode(id, s) {
        const g = svgEl("g", { id: `ent-${id}` }, this.worldLayer);
        const w = s.w;
        const h = s.h;
        svgEl("path", {
            d: `M ${-w / 2} 0 L ${-w / 2 + 5} ${-h * 0.65} L ${-w * 0.12} ${-h} L ${w / 2 - 7} ${-h * 0.8} L ${w / 2} 0 Z`,
            fill: "#8b8578",
            stroke: "#5f5a4f",
            "stroke-width": 2,
        }, g);
        svgEl("path", { d: `M ${-w * 0.12} ${-h} L ${-w * 0.05} ${-h * 0.45} L ${w * 0.18} ${-h * 0.5}`, stroke: "#6f6a5e", "stroke-width": 1.6, fill: "none" }, g);
        return g;
    }
    dropNode(id, r) {
        const g = svgEl("g", { id: `ent-${id}` }, this.worldLayer);
        svgEl("path", { d: `M ${-r} 2 L ${-r * 0.55} ${-r * 0.8} L ${r * 0.15} ${-r} L ${r} ${-r * 0.2} L ${r * 0.6} ${r * 0.8} L ${-r * 0.3} ${r} Z`, fill: "#7a6a5d", stroke: "#4e4238", "stroke-width": 2 }, g);
        svgEl("path", { d: `M ${-r * 0.4} ${-r * 0.4} L ${r * 0.1} ${-r * 0.1} L ${r * 0.35} ${r * 0.35}`, stroke: "#5d5147", "stroke-width": 1.5, fill: "none" }, g);
        const trail = svgEl("g", { class: "trail" }, g);
        svgEl("line", { x1: -3, y1: -r - 6, x2: -3, y2: -r - 20, stroke: "#8a7d70", "stroke-width": 2, opacity: 0.7 }, trail);
        svgEl("line", { x1: 4, y1: -r - 10, x2: 4, y2: -r - 26, stroke: "#8a7d70", "stroke-width": 2, opacity: 0.5 }, trail);
        const dust = svgEl("g", { class: "dust", opacity: 0 }, g);
        svgEl("circle", { cx: -r - 4, cy: r * 0.6, r: 4, fill: "#c9b993" }, dust);
        svgEl("circle", { cx: r + 5, cy: r * 0.6, r: 5, fill: "#c9b993" }, dust);
        this.trailNodes.set(id, trail);
        this.dustNodes.set(id, dust);
        return g;
    }
    update(sim) {
        const r = this.refs;
        const bikeX = sim.bikeX;
        // 视差背景
        const cm = (v, m) => ((v % m) + m) % m;
        const cloudBases = [140, 520, 830];
        this.clouds.forEach((c, i) => {
            const x = cm(cloudBases[i] - bikeX * 0.15, 1300) - 170;
            setA(c, "transform", `translate(${x.toFixed(1)},${70 + i * 46})`);
        });
        const hillX = -cm(bikeX * 0.3, 960);
        setA(this.hills[0], "transform", `translate(${hillX.toFixed(1)},0)`);
        setA(this.hills[1], "transform", `translate(${(hillX + 960).toFixed(1)},0)`);
        this.stripes.forEach((g, i) => {
            const x = cm(i * 160 + 40 - bikeX, 1440) - 240;
            setA(g, "transform", `translate(${x.toFixed(1)},${GROUND_Y + 26 + (i % 3) * 22})`);
            setA(g, "opacity", x > -60 && x < VIEW_W + 60 ? 1 : 0);
        });
        // 车组整体（跃起时抬升）
        setA(this.bikeGroup, "transform", `translate(${BIKE_SCREEN_X},${GROUND_Y - sim.lift})`);
        setA(this.shadow, "rx", 110 - sim.lift * 0.6);
        setA(this.shadow, "opacity", 0.16 - sim.lift * 0.0016);
        // 车轮 / 曲柄同步旋转（spin 节点在 buildWheel 时已缓存，不再逐帧 querySelector）
        const wheelDeg = (sim.wheelAngle * 180) / Math.PI;
        setA(this.spinRear, "transform", `rotate(${wheelDeg.toFixed(2)})`);
        setA(this.spinFront, "transform", `rotate(${wheelDeg.toFixed(2)})`);
        // 踏板 / 曲柄 / 腿（脚与踏板刚性绑定：IK 目标即踏板点）
        const pN = sim.pedalPos(0);
        const pF = sim.pedalPos(Math.PI);
        const legN = sim.legIK(GEO.hip, pN, -1);
        const legF = sim.legIK(GEO.hipFar, pF, -1);
        setA(r.crankArmNear, "x1", GEO.crank.x);
        setA(r.crankArmNear, "y1", GEO.crank.y);
        setA(r.crankArmNear, "x2", pN.x);
        setA(r.crankArmNear, "y2", pN.y);
        setA(r.crankArmFar, "x1", GEO.crank.x);
        setA(r.crankArmFar, "y1", GEO.crank.y);
        setA(r.crankArmFar, "x2", pF.x);
        setA(r.crankArmFar, "y2", pF.y);
        setA(r.pedalNear, "transform", `translate(${pN.x},${pN.y})`);
        setA(r.pedalFar, "transform", `translate(${pF.x},${pF.y})`);
        setA(r.legNear, "d", `M ${GEO.hip.x} ${GEO.hip.y} L ${legN.joint.x.toFixed(2)} ${legN.joint.y.toFixed(2)} L ${legN.target.x.toFixed(2)} ${legN.target.y.toFixed(2)}`);
        setA(r.kneeNear, "cx", legN.joint.x.toFixed(2));
        setA(r.kneeNear, "cy", legN.joint.y.toFixed(2));
        setA(r.footNear, "d", `M ${legN.target.x.toFixed(2)} ${legN.target.y.toFixed(2)} l 15 1`);
        setA(r.legFar, "d", `M ${GEO.hipFar.x} ${GEO.hipFar.y} L ${legF.joint.x.toFixed(2)} ${legF.joint.y.toFixed(2)} L ${legF.target.x.toFixed(2)} ${legF.target.y.toFixed(2)}`);
        setA(r.footFar, "d", `M ${legF.target.x.toFixed(2)} ${legF.target.y.toFixed(2)} l 15 1`);
        setA(r.markerPedalNear, "cx", pN.x);
        setA(r.markerPedalNear, "cy", pN.y);
        setA(r.markerFootNear, "cx", legN.target.x);
        setA(r.markerFootNear, "cy", legN.target.y);
        setA(r.markerPedalFar, "cx", pF.x);
        setA(r.markerPedalFar, "cy", pF.y);
        setA(r.markerFootFar, "cx", legF.target.x);
        setA(r.markerFootFar, "cy", legF.target.y);
        // 上身后仰（髋部为轴）
        setA(this.upperGroup, "transform", `rotate(${((sim.lean * 180) / Math.PI).toFixed(2)} ${GEO.hip.x} ${GEO.hip.y})`);
        // 抬头看坠落物（颈根为轴）
        setA(this.headGroup, "transform", `rotate(${((-0.32 * sim.headAim * 180) / Math.PI).toFixed(2)} ${GEO.neckBase.x} ${GEO.neckBase.y})`);
        // 喉囊轻微摆动
        const sag = -172 + Math.sin(sim.t * 2.4) * 3 - sim.headAim * 6;
        setA(this.pouch, "d", `M 42 -201 Q 74 ${sag.toFixed(1)} 106 -194 Q 76 ${(-188 - sim.headAim * 4).toFixed(1)} 42 -201 Z`);
        // 远侧翅膀轻微扇动（近侧翅膀必须扶把，不扇动）
        setA(this.wingFar, "transform", `rotate(${(Math.sin(sim.t * 3.2) * 4).toFixed(2)} ${GEO.shoulder.x} ${GEO.shoulder.y})`);
        // 近侧翅膀：肩（随后仰）→ 肘 → 握把（IK，翅尖精确落在握把上）
        const sh = sim.shoulderPos();
        const wing = sim.wingIK();
        const seg = (el, x1, y1, x2, y2) => {
            if (!el)
                return;
            setA(el, "x1", x1.toFixed(2));
            setA(el, "y1", y1.toFixed(2));
            setA(el, "x2", x2.toFixed(2));
            setA(el, "y2", y2.toFixed(2));
        };
        seg(r.wingUpper, sh.x, sh.y, wing.joint.x, wing.joint.y);
        seg(r.wingUpperInk, sh.x, sh.y + 4, wing.joint.x, wing.joint.y + 3);
        seg(r.wingFore, wing.joint.x, wing.joint.y, GEO.grip.x, GEO.grip.y);
        setA(r.wingTipDot, "cx", GEO.grip.x);
        setA(r.wingTipDot, "cy", GEO.grip.y);
        setA(r.markerWingTip, "cx", GEO.grip.x);
        setA(r.markerWingTip, "cy", GEO.grip.y);
        // 世界实体
        const screenX = (wx) => wx - bikeX + BIKE_SCREEN_X;
        const aliveStones = new Set();
        for (const s of sim.stones()) {
            aliveStones.add(s.id);
            let g = this.stoneNodes.get(s.id);
            if (!g) {
                g = this.stoneNode(s.id, s);
                this.stoneNodes.set(s.id, g);
            }
            const sx = screenX(s.x);
            setA(g, "transform", `translate(${sx.toFixed(1)},${GROUND_Y})`);
            setA(g, "display", sx > -120 && sx < VIEW_W + 120 ? "" : "none");
        }
        const aliveDrops = new Set();
        for (const d of sim.drops()) {
            aliveDrops.add(d.id);
            let g = this.dropNodes.get(d.id);
            if (!g) {
                g = this.dropNode(d.id, d.r);
                this.dropNodes.set(d.id, g);
            }
            const sx = screenX(d.x);
            const sy = GROUND_Y - d.alt;
            setA(g, "transform", `translate(${sx.toFixed(1)},${sy.toFixed(1)})`);
            const visible = !d.gone && sx > -120 && sx < VIEW_W + 120;
            setA(g, "display", visible ? "" : "none");
            setA(this.trailNodes.get(d.id), "opacity", !d.landed ? 1 : 0);
            const dust = this.dustNodes.get(d.id);
            if (dust) {
                const k = d.landed && !d.gone ? Math.max(0, 1 - (sim.t - d.landTime) / DROP_GONE_DELAY) : 0;
                setA(dust, "opacity", k.toFixed(2));
                setA(dust, "transform", `scale(${(1 + (1 - k) * 0.8).toFixed(2)})`);
            }
        }
        for (const [id, g] of this.stoneNodes) {
            if (!aliveStones.has(id)) {
                g.remove();
                this.stoneNodes.delete(id);
            }
        }
        for (const [id, g] of this.dropNodes) {
            if (!aliveDrops.has(id)) {
                g.remove();
                this.dropNodes.delete(id);
                this.trailNodes.delete(id);
                this.dustNodes.delete(id);
            }
        }
        // HUD
        this.hudMode.textContent = `状态 ${MODE_ZH[sim.mode]}  速度 ${sim.v.toFixed(0)} px/s  时间 ${sim.t.toFixed(2)}s`;
        const info = [];
        for (const s of sim.threatStones().slice(0, 1))
            info.push(`石头 ${s.id} 距前轮 ${(s.x - sim.frontX).toFixed(0)}px`);
        for (const d of sim.threatDrops().slice(0, 1))
            info.push(`坠落物 ${d.id} 高度 ${d.alt.toFixed(0)}px${d.landed ? " 已落地" : ""}`);
        this.hudInfo.textContent = info.join("  |  ");
    }
}

;
"use strict";
// ===== 启动入口：rAF 播放循环 + 供自动化验证使用的确定性 API =====
(function boot() {
    const svg = document.getElementById("stage");
    const sim = new Simulation();
    const renderer = new Renderer(svg, sim);
    let playing = true;
    let acc = 0;
    let last = performance.now();
    function frame(now) {
        const elapsed = Math.min(0.1, (now - last) / 1000);
        last = now;
        if (playing) {
            acc += elapsed;
            let guard = 0;
            while (acc >= DT && guard < 240) {
                sim.step(DT);
                acc -= DT;
                guard += 1;
            }
            renderer.update(sim);
        }
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    const api = {
        version: 1,
        constants: {
            DT,
            VIEW_W,
            VIEW_H,
            GROUND_Y,
            BIKE_SCREEN_X,
            WHEEL_R,
            FRONT_OFFSET,
            CRUISE_SPEED,
            APPROACH_MIN,
            HOP_H,
            HOP_LEN,
            SAFE_GAP,
            CYCLE_T,
            GEO,
        },
        sim,
        renderer,
        play() {
            if (!playing) {
                playing = true;
                last = performance.now();
                acc = 0;
            }
        },
        pause() {
            playing = false;
        },
        reset() {
            sim.reset();
            renderer.update(sim);
        },
        // 确定性跳转：从 0 以固定步长推进到 t（暂停播放）
        seek(t) {
            playing = false;
            sim.reset();
            const n = Math.round(t / DT);
            for (let i = 0; i < n; i++)
                sim.step(DT);
            renderer.update(sim);
        },
        stepOnce(dt = DT) {
            playing = false;
            sim.step(dt);
            renderer.update(sim);
        },
        snapshot() {
            return sim.snapshot();
        },
        geometry() {
            return sim.geometry();
        },
    };
    window.pelican = api;
    document.body.dataset.ready = "yes";
})();

</script>
